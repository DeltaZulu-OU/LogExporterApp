name: Build

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Replace upstream DLL reference with project reference
        shell: pwsh
        run: |
          $projectPath = 'upstream/DnsServer/DnsServerCore.ApplicationCommon/DnsServerCore.ApplicationCommon.csproj'

          if (-not (Test-Path $projectPath)) {
            throw "Project file not found at '$projectPath'."
          }

          $content = Get-Content $projectPath -Raw

          $oldBlock = @(
            "`t<ItemGroup>"
            "`t`t<Reference Include=`"TechnitiumLibrary.Net`">"
            "`t`t`t<HintPath>..\..\TechnitiumLibrary\bin\TechnitiumLibrary.Net.dll</HintPath>"
            "`t`t`t<Private>false</Private>"
            "`t`t</Reference>"
            "`t</ItemGroup>"
          ) -join "`r`n"

          $newBlock = @(
            "`t<ItemGroup>"
            "`t`t<ProjectReference Include=`"..\..\TechnitiumLibrary\TechnitiumLibrary.Net\TechnitiumLibrary.Net.csproj`" />"
            "`t</ItemGroup>"
          ) -join "`r`n"

          if (-not $content.Contains($oldBlock)) {
            $oldBlock = $oldBlock -replace "`r`n", "`n"
            $newBlock = $newBlock -replace "`r`n", "`n"
          }

          if (-not $content.Contains($oldBlock)) {
            throw "Expected TechnitiumLibrary.Net reference block was not found in '$projectPath'."
          }

          $content = $content.Replace($oldBlock, $newBlock)
          Set-Content -Path $projectPath -Value $content -NoNewline

      - name: Restore and build solution
        shell: pwsh
        run: |
          msbuild "src/LogExporterApp.slnx" /restore /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackagesConfig=true /m

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test "tests/LogExporterApp.Tests/LogExporterApp.Tests.csproj" --configuration Release --no-build

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      # Follows the upstream Linux build instructions
      # (https://github.com/TechnitiumSoftware/DnsServer/blob/master/build.md): TechnitiumLibrary
      # is built first so DnsServerCore.ApplicationCommon resolves its TechnitiumLibrary.Net
      # reference from TechnitiumLibrary/bin without patching the upstream project.
      - name: Build TechnitiumLibrary
        run: dotnet build upstream/TechnitiumLibrary/TechnitiumLibrary.Net/TechnitiumLibrary.Net.csproj -c Release

      - name: Build app and tests
        run: dotnet build tests/LogExporterApp.Tests/LogExporterApp.Tests.csproj -c Release

      - name: Run unit tests
        run: dotnet test tests/LogExporterApp.Tests/LogExporterApp.Tests.csproj -c Release --no-build

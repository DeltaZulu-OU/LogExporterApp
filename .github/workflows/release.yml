name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Read release metadata from project file
        id: metadata
        shell: pwsh
        run: |
          $projectPath = "src/$env:APP_NAME.csproj"

          if (-not (Test-Path $projectPath)) {
            throw "Project file not found at '$projectPath'."
          }

          [xml]$project = Get-Content $projectPath
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to read <Version> from '$projectPath'."
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not a 3-part version. Expected format: major.minor.patch."
          }

          $tag = "v$version"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "App name: $env:APP_NAME"
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"

      - name: Validate release tag is new
        shell: pwsh
        run: |
          $tag = '${{ steps.metadata.outputs.tag }}'
          $existingTag = git ls-remote --tags --refs origin "refs/tags/$tag"

          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            throw "Tag '$tag' already exists. Bump <Version> in src/$env:APP_NAME.csproj before releasing."
          }

  build-linux:
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      # Follows the upstream Linux build instructions
      # (https://github.com/TechnitiumSoftware/DnsServer/blob/master/build.md): TechnitiumLibrary
      # is built first so DnsServerCore.ApplicationCommon resolves its TechnitiumLibrary.Net
      # reference from TechnitiumLibrary/bin without patching the upstream project.
      - name: Build TechnitiumLibrary
        run: dotnet build upstream/TechnitiumLibrary/TechnitiumLibrary.Net/TechnitiumLibrary.Net.csproj -c Release

      - name: Build app
        run: dotnet build "src/$APP_NAME.csproj" -c Release

      - name: Prepare release package
        shell: pwsh
        run: ./.github/scripts/New-ReleasePackage.ps1 -AppName $env:APP_NAME -Version '${{ needs.metadata.outputs.version }}'

      - name: Upload Linux release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-release-package
          path: release/${{ env.APP_NAME }}-${{ needs.metadata.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

  build-and-release:
    needs: [metadata, build-linux]
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Replace upstream DLL reference with project reference
        shell: pwsh
        run: |
          $projectPath = 'upstream/DnsServer/DnsServerCore.ApplicationCommon/DnsServerCore.ApplicationCommon.csproj'

          if (-not (Test-Path $projectPath)) {
            throw "Project file not found at '$projectPath'."
          }

          $content = Get-Content $projectPath -Raw

          $oldBlock = @(
            "`t<ItemGroup>"
            "`t`t<Reference Include=`"TechnitiumLibrary.Net`">"
            "`t`t`t<HintPath>..\..\TechnitiumLibrary\bin\TechnitiumLibrary.Net.dll</HintPath>"
            "`t`t`t<Private>false</Private>"
            "`t`t</Reference>"
            "`t</ItemGroup>"
          ) -join "`r`n"

          $newBlock = @(
            "`t<ItemGroup>"
            "`t`t<ProjectReference Include=`"..\..\TechnitiumLibrary\TechnitiumLibrary.Net\TechnitiumLibrary.Net.csproj`" />"
            "`t</ItemGroup>"
          ) -join "`r`n"

          if (-not $content.Contains($oldBlock)) {
            $oldBlock = $oldBlock -replace "`r`n", "`n"
            $newBlock = $newBlock -replace "`r`n", "`n"
          }

          if (-not $content.Contains($oldBlock)) {
            throw "Expected TechnitiumLibrary.Net reference block was not found in '$projectPath'."
          }

          $content = $content.Replace($oldBlock, $newBlock)
          Set-Content -Path $projectPath -Value $content -NoNewline

          Write-Host "Replaced TechnitiumLibrary.Net DLL reference with ProjectReference."

      - name: Restore and build solution
        shell: pwsh
        run: |
          msbuild "src/$env:APP_NAME.slnx" /restore /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackagesConfig=true /m

      - name: Prepare release package
        id: artifacts
        shell: pwsh
        run: |
          $zipPath = ./.github/scripts/New-ReleasePackage.ps1 -AppName $env:APP_NAME -Version '${{ needs.metadata.outputs.version }}'
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download Linux release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-release-package
          path: release-linux

      # The published zip is always the Windows build. The Linux build must contain the same
      # files, otherwise the release stops before anything is tagged or published.
      - name: Verify Linux package matches release package
        shell: pwsh
        run: |
          ./.github/scripts/Compare-ReleasePackage.ps1 `
            -AppName $env:APP_NAME `
            -ExpectedZip '${{ steps.artifacts.outputs.zip_path }}' `
            -ActualZip "release-linux/$env:APP_NAME-${{ needs.metadata.outputs.version }}.zip"

      - name: Create and push git tag
        shell: pwsh
        run: |
          $tag = '${{ needs.metadata.outputs.tag }}'
          git tag $tag
          git push origin "refs/tags/$tag"

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ env.APP_NAME }} v${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.artifacts.outputs.zip_path }}

name: "CodeQL"

on:
  push:
    branches: [master]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [master]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 8 * * 4'

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['csharp']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Replace upstream DLL reference with project reference
        shell: pwsh
        run: |
          $projectPath = 'upstream/DnsServer/DnsServerCore.ApplicationCommon/DnsServerCore.ApplicationCommon.csproj'
          $content = Get-Content $projectPath -Raw
          $pattern = '(?s)<Reference Include="TechnitiumLibrary\.Net">\s*<HintPath>\.\.\\\.\.\\TechnitiumLibrary\\bin\\TechnitiumLibrary\.Net\.dll</HintPath>\s*<Private>false</Private>\s*</Reference>'
          $replacement = '<ProjectReference Include="..\..\TechnitiumLibrary\TechnitiumLibrary.Net\TechnitiumLibrary.Net.csproj" />'
          $updatedContent = $content -replace $pattern, $replacement

          if ($updatedContent -eq $content) {
            throw "Expected TechnitiumLibrary.Net reference was not found in '$projectPath'."
          }

          Set-Content -Path $projectPath -Value $updatedContent -NoNewline

      - name: Build application
        run: dotnet build src/LogExporterApp.csproj --configuration Release --no-incremental

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
